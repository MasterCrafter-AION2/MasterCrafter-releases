<title>MasterCrafter — AION 2</title>
<meta name="description" content="MasterCrafter (prealfa): DPS meter, event alerts, crafting calculator and database explorer for AION 2.">
<link rel="icon" type="image/png" href="logo-64.png">
<style>
:root{--bg:#0b0f19;--card:rgba(15,23,42,.7);--line:#1e293b;--txt:#e2e8f0;--mut:#94a3b8;--acc:#22d3ee;--acc2:#06b6d4;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.mark{position:fixed;inset:0;margin:auto;width:min(60vw,60vh);opacity:.07;pointer-events:none;user-select:none;z-index:-1}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:flex-end;padding-top:14px}
.lang button{background:rgba(15,23,42,.8);color:var(--mut);border:1px solid var(--line);padding:4px 12px;cursor:pointer;font:inherit;font-size:.85rem}
.lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0;border-left:0}
.lang button.on{color:#a5f3fc;background:rgba(6,182,212,.2);border-color:rgba(6,182,212,.5)}
header{padding:24px 0 36px;text-align:center}
.logo{width:min(260px,60vw);height:auto;filter:drop-shadow(0 8px 30px rgba(34,211,238,.18));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:6px 0 10px;letter-spacing:-.02em}
h1 span{color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;color:#fde68a;background:rgba(69,26,3,.45);border:1px solid rgba(180,83,9,.5);padding:3px 12px;border-radius:999px;margin-bottom:14px}
.dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;position:relative;flex:none;display:inline-block}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 1.8s ease-out infinite}
@keyframes ping{to{transform:scale(2.8);opacity:0}}
.lead{color:var(--mut);max-width:620px;margin:0 auto 28px}
.btn{display:inline-block;background:var(--acc2);color:#04121c;font-weight:700;padding:14px 28px;border-radius:12px;text-decoration:none;font-size:1.05rem;border:1px solid var(--acc);transition:transform .2s var(--ease),background .2s}
.btn:hover{background:var(--acc);transform:translateY(-2px)}
.btn.sec{background:rgba(6,182,212,.12);color:#a5f3fc;border:1px solid rgba(6,182,212,.4);padding:10px 20px;font-size:.95rem;font-weight:600}
.btn.sec:hover{background:rgba(6,182,212,.22)}
.btn.off{opacity:.5;pointer-events:none}
.meta{color:var(--mut);font-size:.85rem;margin-top:12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:20px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;transition:border-color .25s,transform .25s var(--ease)}
.grid .card:hover{border-color:rgba(6,182,212,.5);transform:translateY(-3px)}
.card h3{margin:0 0 6px;font-size:1rem;color:var(--acc)}
.card p{margin:0;color:var(--mut);font-size:.92rem}
h2{margin:52px 0 8px;font-size:1.4rem}
.sub{color:var(--mut);margin:0 0 8px;font-size:.95rem}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid #f59e0b;border-radius:10px;padding:14px 16px;color:var(--mut);font-size:.92rem}
.note b{color:var(--txt)}
ol{color:var(--mut);padding-left:20px}
a{color:var(--acc)}

.status{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:44px;padding:20px;border-radius:16px;border:1px solid rgba(180,83,9,.45);background:linear-gradient(135deg,rgba(69,26,3,.4),rgba(15,23,42,.7))}
.status .txt{flex:1;min-width:240px}
.status h3{margin:0 0 4px;font-size:1.05rem;color:#fde68a;display:flex;align-items:center;gap:10px}
.status p{margin:0;color:var(--mut);font-size:.92rem}

.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;margin-top:14px}
.form label{display:grid;gap:4px;font-size:.85rem;color:var(--mut)}
.form input,.form select,.form textarea{background:#0b0f19;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:.95rem;width:100%}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:rgba(6,182,212,.6)}
.form textarea{min-height:120px;resize:vertical}
.form button{cursor:pointer;font:inherit;justify-self:start}
.form button:disabled{opacity:.5;cursor:default}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.msg{font-size:.9rem;min-height:1.2em}.msg.ok{color:#6ee7b7}.msg.err{color:#fda4af}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}

.tl{position:relative;margin:26px 0 0;padding-left:56px}
.tl::before,.tl::after{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:2px;border-radius:2px}
.tl::before{background:var(--line)}
.tl::after{background:linear-gradient(var(--acc),rgba(34,211,238,.1));transform-origin:top;transform:scaleY(0);transition:transform 1.6s var(--ease)}
.tl.in::after{transform:scaleY(1)}
.ms{position:relative;margin-bottom:18px}
.ms .ic{position:absolute;left:-56px;top:2px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#0b0f19;border:2px solid var(--line);color:var(--mut);transition:.4s}
.ms .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ms.now .ic{border-color:var(--acc);color:var(--acc);animation:glow 2.2s infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(34,211,238,.5)}70%{box-shadow:0 0 0 12px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
.ms .card{padding:16px 18px}
.ms.now .card{border-color:rgba(6,182,212,.45);background:linear-gradient(135deg,rgba(6,182,212,.1),rgba(15,23,42,.7))}
.ms:hover .ic{border-color:var(--acc);color:var(--acc)}
.ms h3{color:var(--txt);font-size:1.05rem;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.st{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 9px;border-radius:999px;border:1px solid}
.st.now{color:#67e8f9;background:rgba(6,182,212,.15);border-color:rgba(6,182,212,.4)}
.st.next{color:var(--mut);border-color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:.72rem;color:#a5f3fc;background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.25);padding:1px 9px;border-radius:999px}
.chip a{color:inherit;text-decoration:none}

.goal{display:flex;gap:10px;align-items:flex-start;margin:8px 0;color:var(--mut)}
.goal i{font-style:normal;color:var(--acc)}

.faq{display:grid;gap:10px;margin-top:14px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .25s,opacity .6s var(--ease),transform .6s var(--ease)}
.qa.open{border-color:rgba(6,182,212,.5)}
.qa>button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.qa>button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.qa .n{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--acc);background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.3)}
.qa .q{flex:1;font-weight:600}
.qa .pl{flex:none;width:22px;height:22px;position:relative;color:var(--acc)}
.qa .pl::before,.qa .pl::after{content:"";position:absolute;left:4px;right:4px;top:10px;height:2px;background:currentColor;border-radius:2px;transition:transform .3s var(--ease)}
.qa .pl::after{transform:rotate(90deg)}
.qa.open .pl::after{transform:rotate(0)}
.qa .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.qa.open .bd{grid-template-rows:1fr}
.qa .bd>div{overflow:hidden}
.qa .bd p{margin:0;padding:0 16px 16px 60px;color:var(--mut);font-size:.93rem}

.hist{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
.hist>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:600}
.hist>summary::-webkit-details-marker{display:none}
.branch{display:inline-flex;align-items:center;gap:6px;font:600 .78rem ui-monospace,Consolas,monospace;color:#a5f3fc;background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.35);padding:2px 10px;border-radius:999px}
.branch svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hist .sp{flex:1}
.hsum{color:var(--mut);font-size:.85rem;font-weight:400}
.chev{width:10px;height:10px;border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(45deg);transition:transform .3s var(--ease);margin-right:4px;flex:none}
.hist[open]>summary .chev{transform:rotate(-135deg)}
.graph{position:relative;padding:4px 16px 14px 46px}
.graph::before{content:"";position:absolute;left:25px;top:0;bottom:22px;width:2px;background:linear-gradient(var(--acc),rgba(34,211,238,.15))}
.cm{position:relative;margin:0 0 4px}
.cm::before{content:"";position:absolute;left:-27px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--acc);transition:.25s}
.cm.latest::before{background:var(--acc);box-shadow:0 0 0 4px rgba(34,211,238,.2)}
.cm>button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-radius:8px;cursor:pointer}
.cm>button:hover{background:rgba(6,182,212,.08)}
.cm>button:focus-visible{outline:2px solid var(--acc)}
.cm .v{font:700 .9rem ui-monospace,Consolas,monospace;color:#a5f3fc}
.cm .d{color:var(--mut);font-size:.8rem;flex:1}
.cm .lt{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6ee7b7;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.4);padding:0 7px;border-radius:999px}
.cm .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.cm.open .bd{grid-template-rows:1fr}
.cm .bd>div{overflow:hidden;padding-left:10px}
.cm.open::before{background:var(--acc)}
.cm .chev{transform:rotate(45deg)}
.cm.open .chev{transform:rotate(-135deg)}
.tag{display:inline-block;min-width:78px;text-align:center;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid;border-radius:5px;padding:1px 6px;margin-right:8px}
.t-new{color:#6ee7b7;background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4)}
.t-fixed{color:#fda4af;background:rgba(244,63,94,.15);border-color:rgba(244,63,94,.4)}
.t-improved{color:#67e8f9;background:rgba(6,182,212,.15);border-color:rgba(6,182,212,.4)}
.chg{margin:4px 0;font-size:.9rem;color:var(--mut)}
.chg:last-child{margin-bottom:10px}

footer{margin:56px 0 32px;padding-top:20px;border-top:1px solid var(--line);color:var(--mut);font-size:.8rem;text-align:center}

.rv{opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}.tl::after{transform:none}
}
@media (max-width:520px){.tl{padding-left:50px}.ms .ic{left:-50px;width:36px;height:36px}.tl::before,.tl::after{left:17px}.qa .bd p{padding-left:16px}}
</style>
</head>
<body>
<img class="mark" src="logo.png" alt="" aria-hidden="true">
<div class="wrap">
<div class="top"><div class="lang"><button data-l="es">ES</button><button data-l="en">EN</button></div></div>
<header>
  <img class="logo" src="logo.png" alt="MasterCrafter">
  <h1>Master<span>Crafter</span></h1>
  <div><span class="pill"><i class="dot"></i><span data-t="pill"></span></span></div>
  <p class="lead" data-t="lead"></p>
  <a class="btn" id="dl" href="https://github.com/MasterCrafter-AION2/MasterCrafter-releases/releases/latest/download/MasterCrafter-setup.exe" data-t="download"></a>
  <div class="meta" id="meta"></div>
</header>

<section class="grid">
  <div class="card rv"><h3 data-t="f1h"></h3><p data-t="f1p"></p></div>
  <div class="card rv" style="--d:.05s"><h3 data-t="f2h"></h3><p data-t="f2p"></p></div>
  <div class="card rv" style="--d:.1s"><h3 data-t="f3h"></h3><p data-t="f3p"></p></div>
  <div class="card rv"><h3 data-t="f4h"></h3><p data-t="f4p"></p></div>
  <div class="card rv" style="--d:.05s"><h3 data-t="f5h"></h3><p data-t="f5p"></p></div>
  <div class="card rv" style="--d:.1s"><h3 data-t="f6h"></h3><p data-t="f6p"></p></div>
</section>

<h2 data-t="install"></h2>
<ol>
  <li data-t="i1"></li>
  <li data-t="i2"></li>
  <li><span data-t="i3"></span> <a href="https://npcap.com/#download" rel="noopener">Npcap</a></li>
</ol>
<div class="note" data-t="smart"></div>

<section class="status rv">
  <div class="txt"><h3><i class="dot"></i><span data-t="sth"></span></h3><p data-t="stp"></p></div>
  <a class="btn sec" href="#feedback" data-t="stbtn"></a>
</section>

<h2 id="feedback" data-t="fbh"></h2>
<p class="sub" data-t="fbp"></p>
<form class="form" id="fb" novalidate>
  <label><span data-t="fbtype"></span>
    <select name="type"><option value="bug" data-t="fbbug"></option><option value="suggestion" data-t="fbsug"></option></select></label>
  <label><span data-t="fbtitle"></span><input name="title" maxlength="120" required></label>
  <label><span data-t="fbdesc"></span><textarea name="description" maxlength="4000" required></textarea></label>
  <label><span data-t="fbcontact"></span><input name="contact" maxlength="120"></label>
  <div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
  <button class="btn sec" type="submit" data-t="fbsend"></button>
  <div class="msg" id="fbmsg" role="status"></div>
</form>
<p class="meta" data-t="fbnote"></p>

<h2 data-t="rmh"></h2>
<p class="sub" data-t="rmp"></p>
<div class="tl" id="tl"></div>

<h2 data-t="sph"></h2>
<p class="sub" data-t="spp"></p>
<div class="goal"><i>◆</i><span data-t="g1"></span></div>
<div class="goal"><i>◆</i><span data-t="g2"></span></div>
<div class="goal"><i>◆</i><span data-t="g3"></span></div>
<div class="goal"><i>◆</i><span data-t="g4"></span></div>
<div class="row"><a class="btn sec off" href="#" aria-disabled="true" data-t="spbtn"></a></div>

<h2 data-t="faqh"></h2>
<div class="faq" id="faq"></div>

<h2 data-t="hist"></h2>
<details class="hist" id="hist">
  <summary><span class="branch"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-12 2-12 5.5"/></svg>main</span><span id="hsum" class="hsum"></span><span class="sp"></span><i class="chev"></i></summary>
  <div class="graph" id="graph"></div>
</details>

<footer data-t="foot"></footer>
</div>

 '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',

var L='es',rels=null,io=null;
try{L=localStorage.getItem('mc-lang')||''}catch(e){}
if(L!=='es'&&L!=='en')L=(navigator.language||'es').slice(0,2)==='en'?'en':'es';
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function parse(b){var m=/<!--changes:([\s\S]*?)-->/.exec(b||'');if(!m)return null;try{return JSON.parse(m[1]).changes}catch(e){return null}}
function watch(){
  var els=document.querySelectorAll('.rv:not(.in),.tl:not(.in)');
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
  if(!io)io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.15});
  els.forEach(function(e){io.observe(e)});
}
function renderRoadmap(){
  var t=T[L],h='';
  t.rm.forEach(function(m,i){
    h+='<div class="ms rv '+m.s+'" style="--d:'+(i*.12)+'s"><span class="ic"><svg viewBox="0 0 24 24">'+ICONS[i]+'</svg></span><div class="card"><h3>'+m.h+'<span class="st '+m.s+'">'+m.st+'</span></h3><p>'+m.p+'</p><div class="chips">'+m.c.map(function(c){return '<span class="chip">'+c+'</span>'}).join('')+'</div></div></div>';
  });
  document.getElementById('tl').innerHTML=h;
}
function renderFaq(){
  var box=document.getElementById('faq');box.innerHTML='';
  T[L].faq.forEach(function(f,i){
    var d=document.createElement('div');d.className='qa rv';d.style.setProperty('--d',(i%4*.05)+'s');
    d.innerHTML='<button aria-expanded="false"><span class="n">'+(i+1)+'</span><span class="q">'+f[0]+'</span><span class="pl"></span></button><div class="bd"><div><p>'+f[1]+'</p></div></div>';
    var b=d.firstChild;b.onclick=function(){var o=!d.classList.contains('open');d.classList.toggle('open',o);b.setAttribute('aria-expanded',o)};
    box.appendChild(d);
  });
}
function renderRel(){
  var g=document.getElementById('graph'),t=T[L],sum=document.getElementById('hsum');
  if(rels===null){g.textContent=t.hload;return}
  if(!rels.length){g.textContent=t.hfail;sum.textContent='';return}
  g.innerHTML='';
  sum.textContent=rels[0].tag_name+' · '+rels.length+' '+(L==='en'?'releases':'versiones');
  rels.forEach(function(r,i){
    var c=document.createElement('div');c.className='cm'+(i===0?' latest open':'');
    var date=new Date(r.published_at).toLocaleDateString(L,{day:'numeric',month:'short',year:'numeric'});
    var ch=parse(r.body),body='';
    if(ch){body=ch.map(function(x){return '<div class="chg"><span class="tag t-'+esc(x.type)+'">'+esc(t.tags[x.type]||x.type)+'</span>'+esc(x[L]||x.es)+'</div>'}).join('')}
    else{body='<div class="chg">'+esc((r.body||'').replace(/\*\*/g,''))+'</div>'}
    c.innerHTML='<button><span class="v">'+esc(r.tag_name)+'</span>'+(i===0?'<span class="lt">'+t.lt+'</span>':'')+'<span class="d">'+date+'</span><i class="chev"></i></button><div class="bd"><div>'+body+'</div></div>';
    c.firstChild.onclick=function(){c.classList.toggle('open')};
    g.appendChild(c);
  });
  document.getElementById('meta').textContent=t.ver+' '+rels[0].tag_name.replace(/^v/,'')+' · '+t.req;
}
function apply(){
  var t=T[L];document.documentElement.lang=L;
  document.querySelectorAll('[data-t]').forEach(function(e){var v=t[e.dataset.t];if(v!==undefined){e.innerHTML=v}});
  document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===L)});
  document.getElementById('meta').textContent=t.req;
  renderRoadmap();renderFaq();renderRel();watch();
}
var fb=document.getElementById('fb'),fm=document.getElementById('fbmsg');
fb.onsubmit=function(e){e.preventDefault();var t=T[L],f=fb.elements;
  function say(k,c){fm.className='msg '+c;fm.textContent=t[k]}
  if(f.title.value.trim().length<3||f.description.value.trim().length<10){say('fbinv','err');return}
  var btn=fb.querySelector('button');btn.disabled=true;say('fbwait','');
  fetch('https://mastercrafter-feedback.andresjgsalzate.workers.dev',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:f.type.value,title:f.title.value,description:f.description.value,contact:f.contact.value,website:f.website.value,lang:L,version:rels&&rels[0]?rels[0].tag_name.replace(/^v/,''):''})})
  .then(function(r){if(!r.ok)throw 0;fb.reset();say('fbok','ok')}).catch(function(){say('fberr','err')}).then(function(){btn.disabled=false})};
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){L=b.dataset.l;try{localStorage.setItem('mc-lang',L)}catch(e){}apply()}});
apply();
fetch('https://api.github.com/repos/MasterCrafter-AION2/MasterCrafter-releases/releases').then(function(r){return r.json()}).then(function(l){rels=Array.isArray(l)?l:[];renderRel()}).catch(function(){rels=[];renderRel()});
})();
</script>
