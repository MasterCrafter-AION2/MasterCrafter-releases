name: Sugerencia / Suggestion
description: Una idea o mejora / An idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        MasterCrafter está en desarrollo y tu opinión marca el rumbo. / MasterCrafter is under development and your feedback shapes it.
  - type: textarea
    id: idea
    attributes:
      label: ¿Qué te gustaría que hiciera la app? / What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: motivo
    attributes:
      label: ¿Para qué lo necesitarías? / Why would you need it?
